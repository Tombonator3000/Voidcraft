name: Graphics candidate build and capture

on:
  push:
    branches:
      - test/graphics-candidate-capture

permissions:
  contents: read

concurrency:
  group: graphics-candidate-capture-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYTEST_VERSION: 0.1.0-graphics-candidate.${{ github.run_number }}

jobs:
  build-and-capture:
    name: Build Kubuntu candidate and capture frames
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check Unity build credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=()
          [ -n "$UNITY_LICENSE" ] || missing+=(UNITY_LICENSE)
          [ -n "$UNITY_EMAIL" ] || missing+=(UNITY_EMAIL)
          [ -n "$UNITY_PASSWORD" ] || missing+=(UNITY_PASSWORD)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository Actions secrets: ${missing[*]}."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Sync shared libraries and content
        run: ./scripts/sync-client-libs.sh

      - name: Sync desktop updater libraries
        run: ./scripts/sync-velopack-libs.sh

      - name: Publish bundled local server
        run: ./scripts/publish-local-server.sh linux-x64 ${{ env.PLAYTEST_VERSION }}

      - name: Free disk space for Unity
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - name: Build Linux player
        uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          unityVersion: 6000.4.9f1
          targetPlatform: StandaloneLinux64
          buildMethod: BlocksBeyondTheStars.Client.EditorTools.BuildScript.BuildLinux
          versioning: Custom
          version: ${{ env.PLAYTEST_VERSION }}
          customParameters: -buildOut /github/workspace/player-linux
          allowDirtyBuild: true

      - name: Prepare Linux player
        shell: bash
        run: |
          sudo chmod -R a+rwX player-linux
          sudo chmod +x player-linux/BlocksBeyondTheStars.x86_64
          sudo chmod +x player-linux/BlocksBeyondTheStars_Data/StreamingAssets/server/BlocksBeyondTheStars.GameServer
          test -x player-linux/BlocksBeyondTheStars.x86_64
          test -x player-linux/BlocksBeyondTheStars_Data/StreamingAssets/server/BlocksBeyondTheStars.GameServer
          test -f player-linux/BlocksBeyondTheStars_Data/StreamingAssets/data/stories/voidcraft_awakening/story.json

      - name: Install virtual display runtime
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libgl1-mesa-dri libglu1-mesa libasound2t64

      - name: Capture real game frames
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p captures/en
          set +e
          timeout 300s xvfb-run -a -s "-screen 0 1920x1080x24" \
            ./player-linux/BlocksBeyondTheStars.x86_64 \
            -force-glcore \
            -captureShots \
            -shotOut "$PWD/captures/en" \
            -seed 424242 \
            -lang en \
            -screen-width 1920 \
            -screen-height 1080 \
            -screen-fullscreen 0 \
            -logFile "$PWD/capture-player.log"
          code=$?
          set -e
          echo "main capture exit code=$code"
          test "$code" -eq 0
          test -s captures/en/planet_surface.png
          test -s captures/en/space_flight.png

      - name: Capture jungle turf frame
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set +e
          timeout 300s xvfb-run -a -s "-screen 0 1920x1080x24" \
            ./player-linux/BlocksBeyondTheStars.x86_64 \
            -force-glcore \
            -captureShots \
            -planet jungle \
            -shotOut "$PWD/captures/en" \
            -seed 424242 \
            -lang en \
            -screen-width 1920 \
            -screen-height 1080 \
            -screen-fullscreen 0 \
            -logFile "$PWD/capture-jungle.log"
          code=$?
          set -e
          echo "jungle capture exit code=$code"
          test "$code" -eq 0
          test -s captures/en/surface_jungle.png
          ls -lh captures/en

      - name: Package candidate player
        shell: bash
        run: |
          mkdir -p linux-artifact
          tar -C player-linux -czf "linux-artifact/Voidcraft-Graphics-Candidate-${GITHUB_RUN_NUMBER}.tar.gz" .

      - name: Upload captured frames
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Voidcraft-Graphics-Candidate-Captures-${{ github.run_number }}
          path: |
            captures
            capture-player.log
            capture-jungle.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload candidate game
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Voidcraft-Graphics-Candidate-${{ github.run_number }}
          path: linux-artifact
          if-no-files-found: error
          retention-days: 7
