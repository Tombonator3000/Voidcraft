name: Kubuntu graphics candidate build

on:
  push:
    branches:
      - test/graphics-candidate-capture

permissions:
  contents: read

env:
  PLAYTEST_VERSION: 0.1.0-graphics-candidate.${{ github.run_number }}

jobs:
  build-kubuntu-candidate:
    name: Build downloadable Kubuntu candidate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check Unity build credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=()
          [ -n "$UNITY_LICENSE" ] || missing+=(UNITY_LICENSE)
          [ -n "$UNITY_EMAIL" ] || missing+=(UNITY_EMAIL)
          [ -n "$UNITY_PASSWORD" ] || missing+=(UNITY_PASSWORD)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository Actions secrets: ${missing[*]}."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Sync shared libraries and content
        run: ./scripts/sync-client-libs.sh

      - name: Sync desktop updater libraries
        run: ./scripts/sync-velopack-libs.sh

      - name: Publish bundled local server
        run: ./scripts/publish-local-server.sh linux-x64 ${{ env.PLAYTEST_VERSION }}

      - name: Free disk space for Unity
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - name: Build Linux player
        uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          unityVersion: 6000.4.9f1
          targetPlatform: StandaloneLinux64
          buildMethod: BlocksBeyondTheStars.Client.EditorTools.BuildScript.BuildLinux
          versioning: Custom
          version: ${{ env.PLAYTEST_VERSION }}
          customParameters: -buildOut /github/workspace/player-linux
          allowDirtyBuild: true

      - name: Prepare Linux player
        shell: bash
        run: |
          sudo chmod -R a+rwX player-linux
          sudo chmod +x player-linux/BlocksBeyondTheStars.x86_64
          sudo chmod +x player-linux/BlocksBeyondTheStars_Data/StreamingAssets/server/BlocksBeyondTheStars.GameServer
          test -x player-linux/BlocksBeyondTheStars.x86_64
          test -x player-linux/BlocksBeyondTheStars_Data/StreamingAssets/server/BlocksBeyondTheStars.GameServer
          test -f player-linux/BlocksBeyondTheStars_Data/StreamingAssets/data/stories/voidcraft_awakening/story.json

      - name: Package candidate player
        shell: bash
        run: |
          mkdir -p linux-artifact
          tar -C player-linux -czf "linux-artifact/Voidcraft-Graphics-Candidate-Kubuntu-${GITHUB_RUN_NUMBER}.tar.gz" .

      - name: Upload candidate game
        uses: actions/upload-artifact@v6
        with:
          name: Voidcraft-Graphics-Candidate-Kubuntu-${{ github.run_number }}
          path: linux-artifact
          if-no-files-found: error
          retention-days: 14
